{% include edition-pair.html %}
{% if original and translation %}
<nav class="edition-switch" aria-label="Article language">
  {% if page.lang == 'en' %}
    <a href="{{ original.url | relative_url }}" lang="zh-CN" hreflang="zh-CN">中文原文</a>
    <span aria-hidden="true"> / </span><span lang="en" aria-current="page">English</span>
  {% else %}
    <span lang="zh-CN" aria-current="page">中文原文</span><span aria-hidden="true"> / </span>
    <a href="{{ translation.url | relative_url }}" lang="en" hreflang="en">English</a>
  {% endif %}
</nav>
{% endif %}
