{% include edition-pair.html %}
{% if original and translation %}
<link rel="alternate" hreflang="zh-CN" href="{{ original.url | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ translation.url | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ original.url | absolute_url }}">
{% elsif page.counterpart_url %}
<link rel="alternate" hreflang="{{ page.lang }}" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="{{ page.counterpart_lang }}" href="{{ page.counterpart_url | absolute_url }}">
{% endif %}
